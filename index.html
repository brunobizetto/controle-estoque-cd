.lg-box{width:100%;max-width:360px;background:rgba(255,255,255,.97);border-radius:16px;border-top:4px solid var(--laranja);
  padding:26px 22px 22px;box-shadow:0 18px 40px rgba(0,0,0,.35);}
.lg-marca{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.lg-marca img{width:48px;height:48px;}
.lg-marca b{display:block;font-size:18px;}
.lg-marca span{display:block;font-size:11.5px;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.lg-box label{display:block;font-size:12px;font-weight:bold;color:var(--cinza);margin:12px 0 5px;}
.lg-box input{width:100%;font-size:16px;padding:12px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff;}
.lg-box input:focus{outline:2px solid var(--laranja);border-color:transparent;}
.lg-btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:var(--laranja);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
.lg-btn:disabled{opacity:.6;cursor:wait;}
.lg-msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--vermelho);text-align:center;}
.lg-rod{margin-top:14px;font-size:11px;color:var(--cinza);text-align:center;line-height:1.5;}

/* ---------- app ---------- */
.topo{position:sticky;top:0;z-index:20;background:var(--petroleo);color:#fff;border-bottom:3px solid var(--laranja);
  display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));}
.topo img{width:34px;height:34px;}
.topo .tt{flex:1;min-width:0;}
.topo .tt b{display:block;font-size:15px;}
.topo .tt span{display:block;font-size:11px;color:#C9CCD6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topo button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;}
.abas{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--linha);padding:8px 14px;position:sticky;top:57px;z-index:19;}
.abas button{flex:0 0 auto;border:1px solid var(--linha);background:#fff;color:var(--txt);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:bold;cursor:pointer;}
.abas button.on{background:var(--petroleo);border-color:var(--petroleo);color:#fff;}
main{max-width:1100px;margin:0 auto;padding:14px 12px 90px;}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.barra select{flex:1 1 140px;font-size:15px;padding:10px 10px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--txt);font-weight:bold;}
.seg{display:inline-flex;background:#E7EAF1;border-radius:10px;padding:3px;}
.seg button{border:none;background:transparent;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:bold;color:var(--cinza);cursor:pointer;}
.seg button.on{background:#fff;color:var(--petroleo);box-shadow:0 1px 3px rgba(0,0,0,.12);}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--petroleo);margin:22px 0 10px;border-left:4px solid var(--laranja);padding-left:8px;}
.sub{font-size:11.5px;color:var(--cinza);margin:-4px 0 10px;}
.caixa{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(15,23,42,.07);}

/* cards numa linha só */
.linha-cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;}
.kc{background:#fff;border-radius:12px;padding:10px 8px;box-shadow:0 1px 3px rgba(15,23,42,.07);border-top:3px solid var(--petroleo);min-width:0;text-align:center;}
.kc .k{font-size:10.5px;color:var(--cinza);text-transform:uppercase;letter-spacing:.03em;line-height:1.25;}
.kc .v{font-size:19px;font-weight:bold;margin-top:4px;white-space:nowrap;}
.kc .s{font-size:10px;color:var(--cinza);margin-top:2px;}
.kc.ok{border-top-color:var(--verde);} .kc.ok .v{color:var(--verde);}
.kc.ruim{border-top-color:var(--vermelho);} .kc.ruim .v{color:var(--vermelho);}
.kc.lar{border-top-color:var(--laranja);}

/* lista de indicadores */
.lista-kpi{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-top:10px;}
.lista-kpi div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:14px;}
.lista-kpi div:last-child{border-bottom:none;}
.lista-kpi b{font-size:15px;}
.lista-kpi .ok{color:var(--verde);} .lista-kpi .ruim{color:var(--vermelho);}

/* barras horizontais */
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;}
.hb-row .lb{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:3px;}
.hb-row .lb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hb-row .lb span:last-child{white-space:nowrap;font-weight:bold;}
.hb-track{height:10px;background:#EEF1F6;border-radius:6px;overflow:hidden;}
.hb-fill{height:100%;background:var(--laranja);border-radius:6px;}
.hb-fill.az{background:var(--petroleo);} .hb-fill.vd{background:var(--verde);} .hb-fill.vm{background:var(--vermelho);}

/* tabela */
.tab{width:100%;border-collapse:collapse;font-size:12.5px;}
.tab th{font-size:10.5px;text-transform:uppercase;color:var(--cinza);text-align:right;padding:7px 5px;border-bottom:2px solid var(--linha);font-weight:bold;}
.tab th:first-child,.tab td:first-child{text-align:left;}
.tab td{padding:9px 5px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap;}
.tab tr.tot td{font-weight:bold;border-top:2px solid var(--linha);}
.mini{display:inline-block;width:46px;height:8px;background:#EEF1F6;border-radius:4px;overflow:hidden;vertical-align:middle;}
.mini i{display:block;height:100%;}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* trocas */
.tr-card{display:flex;align-items:center;justify-content:space-between;background:var(--petroleo);color:#fff;border-radius:12px;padding:14px;}
.tr-card .k{font-size:11px;text-transform:uppercase;color:#C9CCD6;letter-spacing:.04em;}
.tr-card .v{font-size:24px;font-weight:bold;}
.tr-card .s{font-size:11px;color:#C9CCD6;text-align:right;line-height:1.5;}
.tr-card .s b{color:#fff;font-size:15px;}
.tr-lista{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-top:8px;}
.tr-lista div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:13.5px;}
.tr-lista div:last-child{border-bottom:none;font-weight:bold;background:#FFF5EE;border-radius:0 0 12px 12px;}
.tr-lista b{color:var(--laranja);}

/* colunas (mensal) */
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding:22px 2px 0;overflow-x:auto;}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px;}
.col .bar{width:70%;max-width:38px;border-radius:6px 6px 0 0;background:var(--petroleo);position:relative;}
.col .bar.ok{background:var(--verde);} .col .bar.ruim{background:var(--vermelho);}
.col .val{font-size:10px;font-weight:bold;margin-bottom:3px;white-space:nowrap;}
.col .mes{font-size:10.5px;color:var(--cinza);margin-top:5px;text-transform:uppercase;}

/* produtividade */
.grade-prod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.grade-prod .kc{text-align:left;padding:12px;}
.grade-prod .kc .v{font-size:21px;}
.dias{display:flex;align-items:flex-end;gap:2px;height:90px;}
.dias i{flex:1;background:var(--petroleo);border-radius:2px 2px 0 0;min-width:3px;}
.vazio{font-size:13px;color:var(--cinza);padding:14px;background:#fff;border-radius:12px;text-align:center;}
.rodape{font-size:11px;color:var(--cinza);text-align:center;margin-top:28px;line-height:1.6;}

@media (max-width:420px){
  .kc .v{font-size:16px;} .kc .k{font-size:9.5px;} .linha-cards{gap:6px;} .kc{padding:9px 5px;}
  .tab{font-size:12px;} .tab td,.tab th{padding-left:3px;padding-right:3px;}
}
@media (min-width:900px){
  .abas{justify-content:center;}
  .grade-prod{grid-template-columns:repeat(3,minmax(0,1fr));}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .duas h3{margin-top:22px;}
}
</style>

<script>
(function(){
'use strict';
/* ================= criptografia ================= */
const cr = window.crypto && window.crypto.subtle;
const enc = new TextEncoder(), dec = new TextDecoder('utf-8');
const b64u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const hex = buf => Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
async function hashLogin(login){ return hex(await cr.digest('SHA-256', enc.encode(PAYLOAD.sal + '|' + login.trim().toLowerCase()))); }
async function kekDe(senha, salt){
  const base = await cr.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  return cr.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt, iterations:PAYLOAD.iter }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function abrir(chave, pac){
  const pt = await cr.decrypt({ name:'AES-GCM', iv:b64u8(pac.iv) }, chave, b64u8(pac.ct));
  return dec.decode(pt);
}
async function chaveRaw(b64){ return cr.importKey('raw', b64u8(b64), 'AES-GCM', false, ['decrypt']); }
async function abrirJSON(b64chave, pac){ return JSON.parse(await abrir(await chaveRaw(b64chave), pac)); }

/* ================= formatação ================= */
const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits:0 });
const fInt = v => nf0.format(Math.round(v || 0));
const fPct = (v, d) => (v === null || v === undefined || isNaN(v)) ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits:d ?? 2, maximumFractionDigits:d ?? 2 }) + '%';
const fPP = v => (v >= 0 ? '+' : '') + v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' p.p.';
const fK = v => { v = v || 0; const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits:2 }) + ' mi';
  if (a >= 1e4) return (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil';
  return fInt(v); };
const fMoney = v => (v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const fData = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLb = m => { const [y, mm] = m.split('-').map(Number); return MESES[mm - 1] + '/' + String(y).slice(2); };

/* ================= estado ================= */
const S = { sessao:null, agg:null, todos:null, eu:null, vista:'dash', modo:'pecas', ciclo:null, cicloAnd:null, cicloProd:'geral', pessoa:null };
const $ = id => document.getElementById(id);
const meta = () => (S.agg && S.agg.meta) || 97;
const cls = v => v === null || v === undefined ? '' : (v >= meta() ? 'ok' : 'ruim');

if (PAYLOAD && PAYLOAD.geradoEm) $('lgAtual').textContent = 'Dados atualizados em ' + new Date(PAYLOAD.geradoEm).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' });

/* ================= login ================= */
$('lgForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('lgBtn'), msg = $('lgMsg');
  const login = $('lgUser').value, senha = $('lgPass').value;
  msg.textContent = '';
  if (!cr){ msg.textContent = 'Este navegador não oferece criptografia. Use Chrome, Edge ou Safari atualizados.'; return; }
  if (!PAYLOAD){ msg.textContent = 'Site sem dados publicados.'; return; }
  btn.disabled = true; btn.textContent = 'Conferindo…';
  try {
    const ent = PAYLOAD.usuarios[await hashLogin(login)];
    if (!ent) throw new Error('x');
    const ses = JSON.parse(await abrir(await kekDe(senha, b64u8(ent.s)), ent));
    $('lgPass').value = '';
    S.sessao = ses;
    S.agg = await abrirJSON(ses.k.agg, PAYLOAD.agg);
    if (ses.k.todos) S.todos = await abrirJSON(ses.k.todos, PAYLOAD.todos);
    if (ses.k.p && ses.pid && PAYLOAD.pessoas[ses.pid]) S.eu = await abrirJSON(ses.k.p, PAYLOAD.pessoas[ses.pid]);
    iniciarApp();
  } catch(err){
    await new Promise(r => setTimeout(r, 700));
    msg.textContent = 'Usuário ou senha incorretos.';
    $('lgPass').value = ''; $('lgPass').focus();
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
$('sair').addEventListener('click', () => { location.reload(); });

const PERFIL_TXT = { visualizacao:'Visualização', colaborador:'Colaborador', analista:'Analista' };
function iniciarApp(){
  const p = S.sessao.perfil;
  $('quem').textContent = (S.sessao.nome || '') + ' · ' + (PERFIL_TXT[p] || p);
  const abas = [['dash', 'Dashboard'], ['and', 'Andamento do ciclo']];
  if (p === 'colaborador' || p === 'analista') abas.push(['prod', p === 'colaborador' ? 'Minha produtividade' : 'Produtividade']);
  $('abas').innerHTML = abas.map(([k, t]) => `<button type="button" data-v="${k}">${t}</button>`).join('');
  $('abas').querySelectorAll('button').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.v)));
  const ks = Object.keys(S.agg.ciclos);
  S.ciclo = S.agg.cicloAtual && S.agg.ciclos[S.agg.cicloAtual] ? S.agg.cicloAtual : ks[ks.length - 1];
  const ksAnd = ks.filter(k => S.agg.ciclos[k].and);
  S.cicloAnd = ksAnd.includes(S.ciclo) ? S.ciclo : ksAnd[ksAnd.length - 1] || null;
  if (p === 'analista' && S.todos){
    const ps = Object.keys(S.todos.pessoas).sort((a, b) => S.todos.pessoas[a].nome.localeCompare(S.todos.pessoas[b].nome, 'pt-BR'));
    S.pessoa = ps[0] || null;
  }
  $('rodape').innerHTML = 'Dados atualizados em ' + new Date(S.agg.geradoEm).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' }) +
    '<br>Loja do Mecânico · CD Cajamar · Controle de Estoque · uso interno';
  $('login').hidden = true; $('app').hidden = false;
  mostrar('dash');
}
function mostrar(v){
  S.vista = v;
  $('abas').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['dash', 'and', 'prod'].forEach(k => { $('v-' + k).hidden = k !== v; });
  if (v === 'dash') renderDash(); else if (v === 'and') renderAnd(); else renderProd();
  window.scrollTo(0, 0);
}
function selCiclo(id, atual, chaves, extra){
  return `<select id="${id}" aria-label="Ciclo">${(extra || []).concat(chaves.map(k => [k, S.agg.ciclos[k].label])).map(([k, t]) =>
    `<option value="${k}"${k === atual ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
}
function segModo(){
  return `<div class="seg" role="group" aria-label="Ver em"><button type="button" data-m="pecas" class="${S.modo === 'pecas' ? 'on' : ''}">Peças</button>` +
    `<button type="button" data-m="posicoes" class="${S.modo === 'posicoes' ? 'on' : ''}">Posições</button></div>`;
}
function ligarSeg(root, fn){ root.querySelectorAll('.seg button[data-m]').forEach(b => b.addEventListener('click', () => { S.modo = b.dataset.m; fn(); })); }
const barras = (linhas, cor) => {
  const mx = Math.max(1e-9, ...linhas.map(l => l.v));
  return `<div class="hb">${linhas.map(l => `<div class="hb-row"><div class="lb"><span>${esc(l.t)}</span><span>${l.txt}</span></div>
    <div class="hb-track"><div class="hb-fill ${l.cor || cor || ''}" style="width:${Math.max(2, l.v / mx * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>`;
};
const card = (k, v, s, c) => `<div class="kc ${c || ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const LOG_TXT = lg => lg === 'CORRECAO' ? 'AIR LOG' : lg;

/* ================= DASHBOARD ================= */
function renderDash(){
  const box = $('v-dash');
  const c = S.agg.ciclos[S.ciclo];
  const pc = S.modo === 'pecas';
  const t = c.tot;
  const acc = pc ? c.accPecas : c.accLocais;
  let h = `<div class="barra">${selCiclo('dCiclo', S.ciclo, Object.keys(S.agg.ciclos))}${segModo()}</div>`;
  h += `<div class="linha-cards">
    ${card('Acuracidade', fPct(acc), pc ? 'de peças' : 'de posições', cls(acc))}
    ${card('Contadas', fK(pc ? t.pecas : t.posicoes), pc ? 'peças' : 'posições', 'lar')}
    ${card('Divergentes', fK(pc ? t.pecasDiv : t.posDiv), pc ? 'peças' : 'posições', 'ruim')}
  </div>`;
  const ind = [
    ['Acuracidade de peças', fPct(c.accPecas), cls(c.accPecas)],
    ['Acuracidade de locais', fPct(c.accLocais), cls(c.accLocais)],
    ['Taxa de cancelamento', fPct(c.cancel), ''],
    ['Taxa de recontagem', fPct(c.recontagem), ''],
    ['Índice de retrabalho', c.retrabalho ? c.retrabalho.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '—', ''],
    ['Posições fechadas', fInt(c.posicoesFechadas), ''],
    ['Média de posições por dia útil', fInt(c.mediaDia), ''],
    ['Dias úteis do ciclo', fInt(c.diasUteis), ''],
  ];
  h += `<div class="lista-kpi">${ind.map(([k, v, cc]) => `<div><span>${k}</span><b class="${cc}">${v}</b></div>`).join('')}</div>`;

  // top 10 itens
  const top = (c.top10 || []).slice().sort((a, b) => pc ? b.pecas - a.pecas : b.locais - a.locais).slice(0, 10);
  h += `<div class="duas"><div><h3>Top 10 itens divergentes</h3><div class="caixa">${top.length ? barras(top.map(i => ({ t:i.nome || ('Item ' + i.item),
      v: pc ? i.pecas : i.locais, txt: pc ? fInt(i.pecas) + ' pçs' : fInt(i.locais) + ' loc.' }))) : '<div class="vazio">Sem divergências.</div>'}</div></div>`;
  // divergência por LOG
  const logs = Object.keys(c.logs || {});
  const divLog = logs.map(lg => ({ t:LOG_TXT(lg), v: pc ? c.logs[lg].pecasDiv : c.logs[lg].div,
    txt: pc ? fInt(c.logs[lg].pecasDiv) + ' pçs' : fInt(c.logs[lg].div) + ' pos.' })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  h += `<div><h3>Divergência por LOG</h3><div class="caixa">${divLog.length ? barras(divLog, 'az') : '<div class="vazio">Sem divergências.</div>'}</div></div></div>`;
  // tabela por LOG
  const linhasLog = logs.map(lg => { const s = c.logs[lg];
    const cont = pc ? s.pecas : s.feito, div = pc ? s.pecasDiv : s.div;
    const a = pc ? (s.saldo ? Math.max(0, 1 - s.pecasDiv / s.saldo) * 100 : null) : (s.feito ? (1 - s.div / s.feito) * 100 : null);
    return { lg, cont, div, a }; }).sort((x, y) => y.cont - x.cont);
  const mini = a => a === null ? '' : `<span class="mini"><i style="width:${Math.max(3, Math.min(100, (a - 80) / 20 * 100)).toFixed(0)}%;background:${a >= meta() ? 'var(--verde)' : 'var(--vermelho)'}"></i></span>`;
  h += `<h3>Por LOG</h3><div class="caixa rolagem"><table class="tab"><thead><tr><th>LOG</th><th>${pc ? 'Peças' : 'Posições'} contadas</th><th>${pc ? 'Peças' : 'Posições'} diverg.</th><th>Acurac.</th><th></th></tr></thead><tbody>` +
    linhasLog.map(r => `<tr><td><b>${LOG_TXT(r.lg)}</b></td><td>${fK(r.cont)}</td><td>${fInt(r.div)}</td><td class="${cls(r.a)}">${fPct(r.a)}</td><td>${mini(r.a)}</td></tr>`).join('') +
    `<tr class="tot"><td>Total</td><td>${fK(pc ? t.pecas : t.posicoes)}</td><td>${fInt(pc ? t.pecasDiv : t.posDiv)}</td><td>${fPct(acc)}</td><td>${mini(acc)}</td></tr></tbody></table></div>`;
  // trocas / reconciliação (sempre em peças)
  if (c.trocas){
    const r = c.trocas;
    h += `<h3>Trocas e itens achados</h3><div class="sub">Quanto a acuracidade de peças subiria em cada caso (p.p. = pontos percentuais).</div>
      <div class="tr-card"><div><div class="k">Acuracidade geral</div><div class="v">${fPct(r.acc0)}</div></div>
        <div class="s">reconciliada<br><b>${fPct(r.accFinal)}</b></div></div>
      <div class="tr-lista">
        <div><span>Trocas vizinhas laterais</span><b>${fPP(r.ppLado)}</b></div>
        <div><span>Trocas vizinhas de nível</span><b>${fPP(r.ppNivel)}</b></div>
        <div><span>Itens em outro endereço</span><b>${fPP(r.ppOutro)}</b></div>
        <div><span>Auditorias (ADE e rotativo)</span><b>${fPP(r.ppAud)}</b></div>
        <div><span>Geral</span><b>${fPP(r.ppTotal)}</b></div>
      </div>`;
  }
  // acuracidade mensal (colunas; eixo começa em 85% mas não aparece)
  const mens = (S.agg.mensal || []).filter(m => (pc ? m.accPecas : m.accLocais) !== null);
  if (mens.length){
    const MIN = 85;
    h += `<h3>Acuracidade mensal</h3><div class="sub">${pc ? 'Peças' : 'Posições'} · todos os ciclos</div><div class="caixa"><div class="cols">` +
      mens.map(m => { const v = pc ? m.accPecas : m.accLocais; const alt = Math.max(3, (Math.max(MIN, v) - MIN) / (100 - MIN) * 100);
        return `<div class="col"><div class="val">${fPct(v, 1)}</div><div class="bar ${cls(v)}" style="height:${alt.toFixed(1)}%"></div><div class="mes">${mesLb(m.mes)}</div></div>`; }).join('') +
      `</div></div>`;
  }
  box.innerHTML = h;
  $('dCiclo').addEventListener('change', e => { S.ciclo = e.target.value; renderDash(); });
  ligarSeg(box, renderDash);
}

/* ================= ANDAMENTO ================= */
function renderAnd(){
  const box = $('v-and');
  const ks = Object.keys(S.agg.ciclos).filter(k => S.agg.ciclos[k].and);
  if (!ks.length){ box.innerHTML = '<div class="vazio">Nenhum ciclo com escopo programado.</div>'; return; }
  const c = S.agg.ciclos[S.cicloAnd], a = c.and;
  const avanco = a.n ? a.feito / a.n * 100 : 0;
  let h = `<div class="barra">${selCiclo('aCiclo', S.cicloAnd, ks)}</div>`;
  h += `<div class="linha-cards">
    ${card('Acurac. peças', fPct(a.accPecas), '', cls(a.accPecas))}
    ${card('Avanço', fPct(avanco, 1), fInt(a.feito) + '/' + fK(a.n), avanco >= 99.995 ? 'ok' : 'lar')}
    ${card('Peças contadas', fK(a.pecas), '')}
    ${card('Peças diverg.', fK(a.pecasDiv), '', 'ruim')}
  </div>`;
  const logs = Object.keys(a.logs).sort();
  h += `<div class="duas"><div><h3>Avanço por LOG</h3><div class="caixa">` + barras(logs.map(lg => { const s = a.logs[lg]; const p = s.n ? s.feito / s.n * 100 : 0;
      return { t: LOG_TXT(lg) + ' · ' + fInt(s.n) + ' pos.', v: p, txt: fPct(p, 1), cor: p >= 99.995 ? 'vd' : '' }; }).map(x => x)) + `</div></div>`;
  // inacuracidade por LOG
  const inac = Object.keys(c.logs || {}).map(lg => { const s = c.logs[lg]; const ap = s.saldo ? Math.max(0, 1 - s.pecasDiv / s.saldo) * 100 : 100;
    return { t: LOG_TXT(lg), v: 100 - ap, txt: fPct(100 - ap) + ' · ' + fInt(s.pecasDiv) + ' pçs', cor:'vm' }; }).sort((x, y) => y.v - x.v);
  h += `<div><h3>Inacuracidade por LOG</h3><div class="sub">Peças divergentes ÷ saldo lógico do LOG</div><div class="caixa">${barras(inac)}</div></div></div>`;
  h += `<h3>Tabela por LOG</h3><div class="caixa rolagem"><table class="tab"><thead><tr><th>LOG</th><th>Escopo</th><th>Contadas</th><th>Pendentes</th><th>Avanço</th><th>Acurac. pçs</th></tr></thead><tbody>` +
    logs.map(lg => { const s = a.logs[lg]; const p = s.n ? s.feito / s.n * 100 : 0; const ap = s.saldo ? Math.max(0, 1 - s.pecasDiv / s.saldo) * 100 : null;
      return `<tr><td><b>${LOG_TXT(lg)}</b></td><td>${fInt(s.n)}</td><td>${fInt(s.feito)}</td><td>${fInt(s.n - s.feito)}</td><td>${fPct(p, 1)}</td><td class="${cls(ap)}">${fPct(ap)}</td></tr>`; }).join('') +
    `<tr class="tot"><td>Total</td><td>${fInt(a.n)}</td><td>${fInt(a.feito)}</td><td>${fInt(a.n - a.feito)}</td><td>${fPct(avanco, 1)}</td><td class="${cls(a.accPecas)}">${fPct(a.accPecas)}</td></tr></tbody></table></div>`;
  box.innerHTML = h;
  $('aCiclo').addEventListener('change', e => { S.cicloAnd = e.target.value; renderAnd(); });
}

/* ================= PRODUTIVIDADE ================= */
function renderProd(){
  const box = $('v-prod');
  const analista = S.sessao.perfil === 'analista';
  const fonte = analista ? (S.todos && S.todos.pessoas[S.pessoa]) : S.eu;
  if (!fonte){ box.innerHTML = '<div class="vazio">Sem dados de produtividade para este usuário.</div>'; return; }
  const ks = Object.keys(fonte.ciclos);
  if (S.cicloProd !== 'geral' && !ks.includes(S.cicloProd)) S.cicloProd = 'geral';
  const st = S.cicloProd === 'geral' ? fonte.geral : fonte.ciclos[S.cicloProd];
  const eq = (S.cicloProd === 'geral' ? fonte.equipe.geral : fonte.equipe[S.cicloProd]) || {};
  let h = '<div class="barra">';
  if (analista){
    const ps = Object.keys(S.todos.pessoas).sort((a, b) => S.todos.pessoas[a].nome.localeCompare(S.todos.pessoas[b].nome, 'pt-BR'));
    h += `<select id="pPessoa" aria-label="Conferente">${ps.map(p => `<option value="${p}"${p === S.pessoa ? ' selected' : ''}>${esc(S.todos.pessoas[p].nome)}</option>`).join('')}</select>`;
  }
  h += `<select id="pCiclo" aria-label="Ciclo"><option value="geral"${S.cicloProd === 'geral' ? ' selected' : ''}>Todos os ciclos</option>` +
    ks.map(k => `<option value="${k}"${k === S.cicloProd ? ' selected' : ''}>${esc(S.agg.ciclos[k] ? S.agg.ciclos[k].label : k)}</option>`).join('') + `</select></div>`;
  if (!analista) h += `<div class="sub" style="margin:0 0 10px;">${esc(fonte.nome)}</div>`;
  if (!st || !st.contagens){ box.innerHTML = h + '<div class="vazio">Sem contagens neste ciclo.</div>'; ligarProd(); return; }
  const vs = (v, m, suf, casas) => (m === null || m === undefined || v === null) ? '' :
    `<span style="color:${v >= m ? 'var(--verde)' : 'var(--vermelho)'}">${v >= m ? '+' : ''}${(v - m).toLocaleString('pt-BR', { maximumFractionDigits:casas ?? 1 })}${suf}</span> vs. equipe`;
  h += `<div class="grade-prod">
    ${card('Assertividade', fPct(st.assert), vs(st.assert, eq.assert, ' p.p.'), cls(st.assert))}
    ${card('Posições contadas por dia', st.mediaDia.toLocaleString('pt-BR', { maximumFractionDigits:1 }), vs(st.mediaDia, eq.mediaDia, '', 0), 'lar')}
    ${card('Contagens', fInt(st.contagens), fInt(st.dias) + ' dia(s) com atividade')}
    ${card('Erros', fInt(st.erros), st.contagens ? fPct(st.erros / st.contagens * 100, 1) + ' das conferências' : '', st.erros ? 'ruim' : 'ok')}
    ${card('Peças em erro', fInt(st.pecas), fMoney(st.valor), st.pecas ? 'ruim' : '')}
    ${card('4ª contagem sem confirmação', fInt(st.semConf.n), fInt(st.semConf.pecas) + ' pçs · ' + fMoney(st.semConf.valor), st.semConf.n ? 'ruim' : '')}
  </div>`;
  const dias = Object.keys(st.porDia || {}).sort().slice(-40);
  if (dias.length){
    const mx = Math.max(1, ...dias.map(d => st.porDia[d]));
    h += `<h3>Contagens por dia</h3><div class="sub">últimos ${dias.length} dia(s) com atividade · ${fData(dias[0])} a ${fData(dias[dias.length - 1])}</div>
      <div class="caixa"><div class="dias">${dias.map(d => `<i title="${fData(d)}: ${fInt(st.porDia[d])}" style="height:${Math.max(3, st.porDia[d] / mx * 100).toFixed(1)}%"></i>`).join('')}</div></div>`;
  }
  const lgs = Object.keys(st.porLog || {}).sort((a, b) => st.porLog[b].n - st.porLog[a].n);
  h += `<h3>Por LOG</h3><div class="caixa rolagem"><table class="tab"><thead><tr><th>LOG</th><th>Contagens</th><th>Erros</th><th>Assert.</th></tr></thead><tbody>` +
    lgs.map(lg => { const r = st.porLog[lg]; const a = r.n ? r.hits / r.n * 100 : null;
      return `<tr><td><b>${LOG_TXT(lg)}</b></td><td>${fInt(r.n)}</td><td>${fInt(r.n - r.hits)}</td><td class="${cls(a)}">${fPct(a, 1)}</td></tr>`; }).join('') + `</tbody></table></div>`;
  if ((st.topErros || []).length){
    h += `<h3>Maiores erros</h3><div class="caixa rolagem"><table class="tab"><thead><tr><th>Endereço</th><th>Data</th><th>Peças</th><th>Valor</th></tr></thead><tbody>` +
      st.topErros.map(e => `<tr><td>${esc(e.local)}<br><span style="font-size:10.5px;color:var(--cinza)">${LOG_TXT(e.log)}</span></td><td>${fData(e.data)}</td><td>${fInt(e.pecas)}</td><td>${fMoney(e.valor)}</td></tr>`).join('') +
      `</tbody></table></div>`;
  }
  box.innerHTML = h;
  ligarProd();
}
function ligarProd(){
  const pp = $('pPessoa'); if (pp) pp.addEventListener('change', e => { S.pessoa = e.target.value; renderProd(); });
  const pc = $('pCiclo'); if (pc) pc.addEventListener('change', e => { S.cicloProd = e.target.value; renderProd(); });
}
})();
</script>
</body>
</html>
